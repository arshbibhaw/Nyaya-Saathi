version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      # Copying basic env vars, modify these in production
      - DATABASE_URL=sqlite:///./nyayasaathi.db
      - JWT_SECRET=change-me-in-production
      # - LLM_API_KEY=your-gemini-key
      # - EMBEDDING_API_KEY=your-openai-key
    volumes:
      - backend_data:/app/data
    restart: unless-stopped

volumes:
  backend_data:
